<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Web Chat</title>
    <style>
        :root { --bg: #0f0f10; --bg2: #1a1a1c; --text: #e6e6e6; --text-dim: #888; --accent: #2d5bd1; --border: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #settings { background: var(--bg2); padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        #settings input { flex: 1; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; outline: none; }
        #settings input:focus { border-color: var(--accent); }
        
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; }
        .user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--bg2); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; }
        
        details.think { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; padding: 8px 12px; font-size: 13px; color: var(--text-dim); }
        details.think summary { cursor: pointer; color: #7fa8ff; font-weight: 600; list-style: none; }
        details.think summary::-webkit-details-marker { display: none; }
        details.think summary::before { content: '▸ '; transition: transform 0.2s; display: inline-block; }
        details.think[open] summary::before { transform: rotate(90deg); }
        details.think pre { white-space: pre-wrap; font-family: monospace; margin-top: 8px; color: #aaa; border-left: 2px solid var(--border); padding-left: 10px; }
        
        #input-container { background: var(--bg2); padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        #input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 12px; font-size: 15px; resize: none; outline: none; height: 52px; max-height: 150px; }
        #input:focus { border-color: var(--accent); }
        #send { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 0 24px; height: 52px; font-size: 15px; font-weight: 600; cursor: pointer; }
        #send:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .error-box { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff4444; color: #ff6666; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <div id="settings">
        <input type="text" id="proxy-url" placeholder="Netlify Proxy URL (e.g. https://...netlify.app/proxy/)">
        <input type="password" id="api-key" placeholder="DeepSeek API Key (sk-...)">
    </div>
    
    <div id="chat"></div>
    
    <div id="input-container">
        <textarea id="input" rows="1" placeholder="Message DeepSeek..."></textarea>
        <button id="send">Send</button>
    </div>

    <script>
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const proxyEl = document.getElementById('proxy-url');
        const keyEl = document.getElementById('api-key');

        // Load saved settings
        proxyEl.value = localStorage.getItem('proxy_url') || 'https://niggaz.netlify.app/proxy/';
        keyEl.value = localStorage.getItem('api_key') || '';
        proxyEl.oninput = () => localStorage.setItem('proxy_url', proxyEl.value);
        keyEl.oninput = () => localStorage.setItem('api_key', keyEl.value);

        const history = []; // Chat memory

        // Auto-resize textarea
        inputEl.addEventListener('input', function() {
            this.style.height = '52px';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            
            if (!proxyEl.value || !keyEl.value) {
                alert("Please enter your Proxy URL and API Key first.");
                return;
            }

            inputEl.value = '';
            inputEl.style.height = '52px';
            
            // 1. Add user message to UI
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.textContent = text;
            chatEl.appendChild(userDiv);
            
            history.push({ role: 'user', content: text });

            // 2. Setup AI Message Shell
            sendBtn.disabled = true;
            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg ai';
            
            const thinkBox = document.createElement('details');
            thinkBox.className = 'think';
            thinkBox.innerHTML = '<summary>Thinking...</summary><pre></pre>';
            const thinkPre = thinkBox.querySelector('pre');
            
            const answerDiv = document.createElement('div');
            
            aiDiv.appendChild(thinkBox);
            aiDiv.appendChild(answerDiv);
            chatEl.appendChild(aiDiv);
            
            chatEl.scrollTop = chatEl.scrollHeight;

            let thinkText = '';
            let answerText = '';

            try {
                // THE FIX: Encode the target URL and append it to the proxy URL
                const targetUrl = encodeURIComponent('https://api.deepseek.com/chat/completions');
                const fullProxyUrl = proxyEl.value + '?url=' + targetUrl;

                const response = await fetch(fullProxyUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + keyEl.value
                    },
                    body: JSON.stringify({
                        model: 'deepseek-reasoner',
                        messages: history,
                        stream: true
                    })
                });

                if (!response.ok) {
                    // Extract exact error from proxy/API
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status} - ${errText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep the last incomplete line

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;
                        
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta || {};
                            
                            if (delta.reasoning_content) {
                                thinkText += delta.reasoning_content;
                                thinkPre.textContent = thinkText;
                            }
                            
                            if (delta.content) {
                                answerText += delta.content;
                                answerDiv.textContent = answerText;
                                thinkBox.open = false; 
                                thinkBox.querySelector('summary').textContent = 'Thought for a moment';
                            }
                            
                            chatEl.scrollTop = chatEl.scrollHeight;
                        } catch (e) {
                            console.warn("Stream parse error:", e);
                        }
                    }
                }

                history.push({ role: 'assistant', content: answerText });

            } catch (err) {
                // Show the exact error on screen
                answerDiv.innerHTML = `<div class="error-box"><strong>CRASH REPORT:</strong><br>${err.message}</div>`;
            } finally {
                sendBtn.disabled = false;
                if (!thinkText && answerDiv.innerHTML === '') thinkBox.remove();
            }
        }

        // Event Listeners
        sendBtn.onclick = sendMessage;
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
