<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f10; color: #e6e6e6; display: flex; flex-direction: column; height: 100vh; }
  #settings { background: #1a1a1c; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #2a2a2d; font-size: 12px; }
  #settings input { flex: 1; min-width: 140px; background: #0f0f10; color: #e6e6e6; border: 1px solid #2a2a2d; padding: 8px; border-radius: 6px; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2d5bd1; color: #fff; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: #1e1e21; border-bottom-left-radius: 4px; }
  details { margin: 8px 0 10px; background: #141416; border: 1px solid #2a2a2d; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #9aa; }
  details summary { cursor: pointer; color: #7fa8ff; font-weight: 600; }
  details pre { white-space: pre-wrap; font-family: inherit; color: #b5b5b5; margin-top: 6px; }
  #inputbar { display: flex; padding: 10px; gap: 8px; background: #1a1a1c; border-top: 1px solid #2a2a2d; }
  #input { flex: 1; background: #0f0f10; color: #e6e6e6; border: 1px solid #2a2a2d; border-radius: 12px; padding: 12px; font-size: 14px; resize: none; }
  #send { background: #2d5bd1; color: #fff; border: none; border-radius: 12px; padding: 0 20px; font-weight: 600; font-size: 14px; }
  #send:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div id="settings">
  <input id="proxy" placeholder="Paste your Vercel proxy URL here" />
  <input id="key" placeholder="Paste your DeepSeek API key (sk-...)" type="password" />
</div>

<div id="chat"></div>

<div id="inputbar">
  <textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
  <button id="send">Send</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const proxyEl = document.getElementById('proxy');
const keyEl = document.getElementById('key');

// Remember settings on this device
proxyEl.value = localStorage.getItem('proxy') || '';
keyEl.value = localStorage.getItem('key') || '';
proxyEl.oninput = () => localStorage.setItem('proxy', proxyEl.value);
keyEl.oninput = () => localStorage.setItem('key', keyEl.value);

const history = []; // keeps conversation context

function addMsg(role, text = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  sendEl.disabled = true;
  const aiEl = addMsg('assistant', '');

  // Create the collapsible "Thinking" tab
  const thinkBox = document.createElement('details');
  thinkBox.innerHTML = '<summary>Thinking...</summary><pre></pre>';
  const thinkPre = thinkBox.querySelector('pre');
  aiEl.appendChild(thinkBox);

  const answerEl = document.createElement('div');
  aiEl.appendChild(answerEl);

  let answerText = '';
  let thinkText = '';

  try {
    const resp = await fetch(proxyEl.value, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + keyEl.value,
      },
      body: JSON.stringify({
        model: 'deepseek-v4-flash',
        messages: history,
        stream: true,
      }),
    });

    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta || {};
          if (delta.reasoning_content) {
            thinkText += delta.reasoning_content;
            thinkPre.textContent = thinkText;
          }
          if (delta.content) {
            answerText += delta.content;
            answerEl.textContent = answerText;
          }
          chatEl.scrollTop = chatEl.scrollHeight;
        } catch {}
      }
    }

    if (!thinkText) thinkBox.remove();
    else thinkBox.querySelector('summary').textContent = 'Thinking';

    history.push({ role: 'assistant', content: answerText });
  } catch (err) {
    answerEl.textContent = 'Error: ' + err.message;
  } finally {
    sendEl.disabled = false;
  }
}

sendEl.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>

</body>
</html>
